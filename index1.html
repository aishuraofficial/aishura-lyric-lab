$('audioFile').addEventListener('change',()=>{if($('audioFile').files[0])storedAudio=$('audioFile').files[0]});
$('photo').addEventListener('change',()=>{if($('photo').files[0])storedPhoto=$('photo').files[0]});
$('clearPhoto').addEventListener('click',()=>{storedPhoto=null});
const memoryFields=['lyrics','sz','dur','font','effect','pos','ink','rip','melt','bright','zoom','word','ratio','exportMode','range','from','to'];
function openMemory(){return new Promise((resolve,reject)=>{const r=indexedDB.open('AISHURA-LYRIC-LAB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('single'))r.result.createObjectStore('single')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('保存領域が使用中です'))})}
async function memoryIO(write,value){const db=await openMemory();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('single',write?'readwrite':'readonly');const st=tx.objectStore('single');const r=write?st.put(value,'current'):st.get('current');tx.oncomplete=()=>resolve(r.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('保存処理が中断されました'))})}finally{db.close()}}
async function memoryAction(fn){if(recording)return;const a=$('storeOne'),b=$('restoreOne');a.disabled=b.disabled=true;audio.pause();try{await fn()}catch(e){$('memoryStatus').textContent='記憶エラー：'+(e.message||e)}finally{a.disabled=b.disabled=false}}
$('storeOne').onclick=()=>memoryAction(async()=>{if(!storedAudio)throw Error('音源を選択してください');if(await memoryIO(false)&&!confirm('保存済みの1曲を上書きしますか？'))return;const data={audio:storedAudio,photo:storedPhoto,lines:[...lines],times:[...times],fields:Object.fromEntries(memoryFields.map(id=>[id,$(id).value])),savedAt:new Date().toISOString()};$('memoryStatus').textContent='保存中…';await memoryIO(true,data);const check=await memoryIO(false);if(!check||check.audio.size!==data.audio.size||(check.photo?.size||0)!==(data.photo?.size||0)||JSON.stringify(check.times)!==JSON.stringify(data.times)||JSON.stringify(check.lines)!==JSON.stringify(data.lines)||JSON.stringify(check.fields)!==JSON.stringify(data.fields))throw Error('保存後の照合に失敗');$('memoryStatus').textContent=`保存・照合成功：${((data.audio.size+(data.photo?.size||0))/1048576).toFixed(1)} MB / ${data.lines.length}行 / 同期 ${data.times.filter(t=>t!==null).length}行`});
$('restoreOne').onclick=()=>memoryAction(async()=>{const d=await memoryIO(false);if(!d)throw Error('保存データがありません');let im=null;if(d.photo){im=new Image();const u=URL.createObjectURL(d.photo);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('保存画像を読み込めません'));im.src=u})}finally{URL.revokeObjectURL(u)}}mode='single';loadId++;storedAudio=d.audio;storedPhoto=d.photo||null;photo=im;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(d.audio);audio.src=audioURL;audio.load();$('audioFile').value='';$('photo').value='';for(const id of memoryFields){if(d.fields[id]!=null)$(id).value=d.fields[id]}$('ratio').onchange();for(const id of ['sz','dur'])$(id).dispatchEvent(new Event('input'));lines=[...d.lines];times=[...d.times];renderCues();reset();$('memoryStatus').textContent=`復元成功：${((d.audio.size+(d.photo?.size||0))/1048576).toFixed(1)} MB / ${lines.length}行 / 同期 ${times.filter(t=>t!==null).length}行（再生は開始しません）`});
memoryIO(false).then(d=>{$('memoryStatus').textContent=d?'保存済み素材あり — 素材を復元を押してください':'保存済み素材なし'}).catch(e=>{$('memoryStatus').textContent='保存領域確認エラー：'+e.message});
</script></html>
