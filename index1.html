<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AISHURA LYRIC LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#111317;color:#e7e7e7;font:15px system-ui;padding:20px}main{max-width:900px;margin:auto}h1{font-size:19px;letter-spacing:.18em}small{color:#999}canvas{display:block;width:100%;max-height:65vh;object-fit:contain;background:#050609}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;color:inherit;background:#20242b;border:1px solid #444;border-radius:7px;padding:12px}input[type=text]{width:100%}input[type=range]{width:100%;padding:0}button{margin-top:16px;width:100%}textarea{width:100%;min-height:140px;background:#20242b;color:inherit;border:1px solid #444;border-radius:7px;padding:12px;font:inherit}audio{width:100%}.cue{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin:8px 0}.cue input{width:100%;padding:8px}#tap{background:#36516b;min-height:65px;position:sticky;bottom:8px} </style><main><h1>AISHURA LYRIC LAB</h1><small>PROTOTYPE 07 / 水葬 × 雪解</small><canvas id="c" width="1920" height="1080"></canvas><section><label>音源（端末内のみ）</label><input id="audioFile" type="file" accept="audio/*,.wav,.m4a,.mp3"><audio id="audio" controls preload="metadata"></audio><label>歌詞一括入力（1行＝1フレーズ）</label><textarea id="lyrics" placeholder="歌詞を貼り付けてください"></textarea><button id="prepare">歌詞を分割・同期を準備</button><button id="syncStart">最初から同期開始</button><button id="tap" disabled>歌詞の開始をタップ</button><button id="undo">直前の同期を取り消す</button><button id="preview">同期プレビュー</button><p id="syncStatus" role="status"></p><div id="cues"></div></section><label>背景画像（端末内のみ）</label><input id="photo" type="file" accept="image/*"><button id="clearPhoto">背景を解除</button><label>背景の明るさ</label><input id="bright" type="range" min="0.1" max="1" step="0.05" value="0.65"><label>背景の拡大率</label><input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"><label>文字色</label><input id="ink" type="color" value="#e4e4df"><label>文字の上下位置</label><input id="pos" type="range" min="20" max="85" value="56"><label>歌詞（端末内のみ）</label><input id="word" type="text" value="静かな夜に消えてゆく"><label>画面比率</label><select id="ratio"><option>16:9</option><option>9:16</option></select><label>文字サイズ</label><input id="sz" type="range" min="30" max="110" value="72"><label>演出時間（秒）</label><input id="dur" type="range" min="5" max="16" value="10"><label>波紋の大きさ</label><input id="rip" type="range" min="0.5" max="3" step="0.1" value="2"><label>雪解けの強さ</label><input id="melt" type="range" min="0.3" max="2" step="0.1" value="1.3"><button id="play">再生 / REPLAY</button><button id="export">10秒動画を書き出す / EXPORT</button><p id="status" role="status"></p><a id="save" hidden style="color:#b9d8ff" download>動画を保存</a><video id="result" hidden controls playsinline style="width:100%;max-height:50vh"></video><p><small>10秒出力は単独演出のみ（音声なし）。同期はプレビュー専用。入力内容は外部送信しません。</small></p></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');const layers=Array.from({length:3},()=>document.createElement('canvas')), contexts=layers.map(l=>l.getContext('2d'));let glyphKey='',glyphs=[];function glyph(ch,size,color){const n=Math.ceil(size*1.7),b=document.createElement('canvas');b.width=b.height=n;const q=b.getContext('2d');q.font=`${size}px "Hiragino Mincho ProN", "Yu Mincho", serif`;q.textAlign='center';q.textBaseline='middle';q.fillStyle=color;q.fillText(ch,n/2,n/2);const data=q.getImageData(0,0,n,n).data,tiles=[],stride=Math.max(2,Math.round(size/24));for(let y=0;y<n;y+=stride)for(let x=0;x<n;x+=stride){let a=0;for(let yy=y;yy<Math.min(n,y+stride);yy++)for(let xx=x;xx<Math.min(n,x+stride);xx++)a=Math.max(a,data[(yy*n+xx)*4+3]);if(a>25){let r=Math.sin(x*127.1+y*311.7)*43758.5453;r-=Math.floor(r);tiles.push({x,y,r,angle:Math.sin(x*19+y*7)*Math.PI});}}return {b,n,tiles,stride};}let start=performance.now(),photo=null,loadId=0;$("photo").onchange=()=>{const f=$("photo").files[0];if(!f)return;const id=++loadId,url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(id===loadId){photo=im;reset()}};im.onerror=()=>{URL.revokeObjectURL(url);if(id===loadId)alert("画像を読み込めませんでした。JPEGまたはPNGをお試しください。")};im.src=url};$("clearPhoto").onclick=()=>{loadId++;photo=null;$("photo").value="";reset()};const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};function reset(){start=performance.now()}$('play').onclick=()=>{mode='single';audio.pause();reset()};$('ratio').onchange=()=>{let v=$('ratio').value==='9:16';c.width=v?1080:1920;c.height=v?1920:1080;reset()};$('word').oninput=reset;for(const id of ['bright','zoom','ink','pos','sz','dur','rip','melt'])$(id).addEventListener('change',reset);function frame(now){let cue=activeCue();let W=c.width,H=c.height,t=cue?Math.min(1.4,cue.elapsed/Number($('dur').value)):Math.min(1.4,(now-start)/1000/Number($('dur').value)),base=H*Number($("pos").value)/100,chars=Array.from(cue?cue.text:$('word').value).slice(0,40),s=Math.min(Number($('sz').value),W*.84/(Math.max(1,chars.length)*1.12)),step=s*1.12;for(let j=0;j<3;j++){let l=layers[j],q=contexts[j];if(l.width!==W||l.height!==H){l.width=W;l.height=H;}q.setTransform(1,0,0,1,0,0);q.globalAlpha=1;q.globalCompositeOperation='source-over';q.clearRect(0,0,W,H);}const [bgctx,rctx,txt]=contexts;const key=chars.join('')+'|'+s+'|'+$('ink').value;if(key!==glyphKey){glyphKey=key;glyphs=chars.map(ch=>glyph(ch,s,$('ink').value));}g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation="source-over";g.shadowBlur=0;g.shadowColor="transparent";g.clearRect(0,0,W,H);let bg=bgctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#040507');bg.addColorStop(.55,'#111820');bg.addColorStop(1,'#030507');bgctx.fillStyle=bg;bgctx.fillRect(0,0,W,H);let glow=bgctx.createRadialGradient(W/2,base,0,W/2,base,W*.55);glow.addColorStop(0,'rgba(105,130,150,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');bgctx.fillStyle=glow;bgctx.fillRect(0,0,W,H);if(photo){let z=Math.max(W/photo.naturalWidth,H/photo.naturalHeight)*Number($("zoom").value),w=photo.naturalWidth*z,h=photo.naturalHeight*z;bgctx.drawImage(photo,(W-w)/2,(H-h)/2,w,h);bgctx.fillStyle=`rgba(0,0,0,${1-Number($("bright").value)})`;bgctx.fillRect(0,0,W,H)}g.font=`${s}px "Hiragino Mincho ProN", "Yu Mincho", serif`;g.textAlign='center';g.textBaseline='middle';chars.forEach((ch,i)=>{let a=t-i*.009,p=smooth(a/.30),x=W/2+(i-(chars.length-1)/2)*step,y=base-s*.55-(1-p)*H*.28,fade=1-smooth((a-.62)/.25);if(a<0)return;let opacity=smooth(a/.12)*fade;const gl=glyphs[i],xx=x+Math.sin(i*2+a*9)*(1-p)*s*.25;let d=clamp((a-.55)/.40);if(a<.95){txt.save();txt.globalAlpha=smooth(a/.12);if(d===0){txt.drawImage(gl.b,xx-gl.n/2,y-gl.n/2);}else{for(const tile of gl.tiles){let release=.12+.65*tile.r+.12*(1-tile.y/gl.n),f=clamp((d-release)/.25),dx=tile.x-gl.n/2,dy=tile.y-gl.n/2;if(f===0){txt.drawImage(gl.b,tile.x,tile.y,gl.stride,gl.stride,xx+dx,y+dy,gl.stride,gl.stride);}else if(f<1){txt.globalAlpha=(1-f)*smooth(a/.12);let spread=Number($('melt').value);txt.drawImage(gl.b,tile.x,tile.y,gl.stride,gl.stride,xx+dx+Math.cos(tile.angle)*f*s*.65*spread,y+dy+f*f*s*1.4*spread,gl.stride*(1-f*.6),gl.stride*(1-f*.6));txt.globalAlpha=smooth(a/.12);}}}txt.restore();}let r=a-.30;if(r>0&&r<.85){for(let k=0;k<3;k++){let q=r-k*.045;if(q<=0)continue;let rad=q*W*.30*Number($('rip').value);rctx.beginPath();rctx.ellipse(x,base,rad,rad*.12,0,0,Math.PI*2);rctx.strokeStyle=`rgba(177,198,211,${.38*(1-clamp(q/.85))*Math.exp(-k*.5)})`;rctx.lineWidth=2.2;rctx.stroke();}} });for(const l of layers)g.drawImage(l,0,0);requestAnimationFrame(frame)}requestAnimationFrame(frame);

let mode='single',lines=[],times=[],audioURL=null;const audio=$('audio');
function activeCue(){if(mode==='single')return null;let i=-1;for(let j=0;j<times.length;j++)if(times[j]!==null&&times[j]<=audio.currentTime&&(i<0||times[j]>=times[i]))i=j;return i<0?{text:'',elapsed:0}:{text:lines[i],elapsed:Math.max(0,audio.currentTime-times[i])};}
function refresh(){let i=times.indexOf(null);$('tap').disabled=mode!=='sync'||i<0||audio.paused;$('tap').textContent=i<0?'同期完了':`タップ ${i+1}/${lines.length}：${lines[i]}`;$('syncStatus').textContent=`${times.filter(t=>t!==null).length}/${lines.length} 行 同期済み`;}
function renderCues(){const root=$('cues');root.replaceChildren();lines.forEach((line,i)=>{const row=document.createElement('div');row.className='cue';const label=document.createElement('span');label.textContent=`${i+1}. ${line}`;const inp=document.createElement('input');inp.type='number';inp.min='0';inp.step='0.01';inp.placeholder='秒';inp.value=times[i]===null?'':times[i].toFixed(2);inp.setAttribute('aria-label',`${i+1}行目の開始秒`);inp.onchange=()=>{let v=inp.valueAsNumber;times[i]=Number.isFinite(v)?Math.max(0,Math.min(Number.isFinite(audio.duration)?audio.duration:Infinity,v)):null;inp.value=times[i]===null?'':times[i].toFixed(2);refresh()};row.append(label,inp);root.append(row)});refresh();}
$('audioFile').onchange=()=>{const f=$('audioFile').files[0];if(!f)return;audio.pause();mode='single';if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);audio.src=audioURL;audio.load();times=lines.map(()=>null);renderCues();};
$('prepare').onclick=()=>{audio.pause();mode='single';lines=$('lyrics').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);times=lines.map(()=>null);renderCues();};
async function begin(sync){if(!audioURL||!lines.length){$('syncStatus').textContent='音源を選び、歌詞を分割してください。';return;}if(sync&&times.some(t=>t!==null)&&!confirm('現在の同期を消して最初から記録しますか？'))return;audio.pause();if(sync){times=lines.map(()=>null);renderCues();}mode=sync?'sync':'preview';audio.currentTime=0;try{await audio.play();refresh()}catch(e){$('syncStatus').textContent='音源を再生できません: '+e.message;}};
$('syncStart').onclick=()=>begin(true);$('preview').onclick=()=>begin(false);$('tap').onclick=()=>{if(mode!=='sync'||audio.paused)return;let i=times.indexOf(null);if(i<0)return;times[i]=audio.currentTime;renderCues();};$('undo').onclick=()=>{let i=times.findLastIndex?times.findLastIndex(t=>t!==null):times.map(t=>t!==null).lastIndexOf(true);if(i>=0){times[i]=null;renderCues();}};audio.addEventListener('play',refresh);audio.addEventListener('pause',refresh);audio.addEventListener('ended',refresh);audio.addEventListener('error',()=>{$('syncStatus').textContent='音源を読み込めませんでした。'});
let recording=false,outputURL=null;
$('export').onclick=()=>{
 if(recording)return;
 audio.pause();mode='single';refresh();
 const status=$('status'),save=$('save'),video=$('result');
 if(!c.captureStream||!window.MediaRecorder){status.textContent='このブラウザはCanvas動画出力に対応していません。';return;}
 const controls=Array.from(document.querySelectorAll('input,select,button,textarea')); let stream,rec,timer,failed=false;
 function cleanup(){clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());controls.forEach(el=>el.disabled=false);recording=false;refresh();}
 try{
  if(outputURL){video.pause();video.removeAttribute('src');video.load();URL.revokeObjectURL(outputURL);outputURL=null;}
  save.hidden=true;video.hidden=true;
  stream=c.captureStream(30);
  const types=['video/mp4;codecs=avc1.420034','video/mp4','video/webm;codecs=vp8','video/webm'];
  for(const mimeType of types){try{if(MediaRecorder.isTypeSupported(mimeType)){rec=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:12000000});break;}}catch(e){}}
  if(!rec)rec=new MediaRecorder(stream,{videoBitsPerSecond:12000000});
  const chunks=[];recording=true;controls.forEach(el=>el.disabled=true);
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onerror=e=>{failed=true;status.textContent='録画エラー: '+(e.error?.message||'不明');cleanup();};
  rec.onstop=()=>{cleanup();if(failed)return;const type=rec.mimeType||chunks[0]?.type||'';const blob=new Blob(chunks,{type});if(!blob.size){status.textContent='動画データが空です。';return;}const ext=type.includes('mp4')?'mp4':type.includes('webm')?'webm':'video';outputURL=URL.createObjectURL(blob);save.href=outputURL;save.download='AISHURA-test-07.'+ext;save.hidden=false;video.src=outputURL;video.hidden=false;status.textContent=`完了: ${ext.toUpperCase()} / ${c.width}×${c.height} / ${(blob.size/1048576).toFixed(1)} MB` ;};
  reset();rec.start();status.textContent='録画中…10秒間この画面を開いたままにしてください。';timer=setTimeout(()=>{if(rec.state!=='inactive')rec.stop();},10000);
 }catch(e){cleanup();status.textContent='書き出し開始失敗: '+e.message;}
};
</script></html>
