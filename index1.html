const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');const layers=Array.from({length:3},()=>document.createElement('canvas')), contexts=layers.map(l=>l.getContext('2d'));let glyphKey='',glyphs=[],bgKey='',lastPhoto=null;const cache=new Map();function cachedGlyph(ch,size,color){const k=JSON.stringify([ch,size,color,$("font").value]);if(!cache.has(k)){if(cache.size>=64)cache.delete(cache.keys().next().value);cache.set(k,glyph(ch,size,color));}return cache.get(k);}function glyph(ch,size,color){const n=Math.ceil(size*1.7),b=document.createElement('canvas');b.width=b.height=n;const q=b.getContext('2d');q.font=`${size}px ${$("font").value=== "serif" ? '"Hiragino Mincho ProN", "Yu Mincho", serif' : 'sans-serif'}`;q.textAlign='center';q.textBaseline='middle';q.fillStyle=color;q.fillText(ch,n/2,n/2);const data=q.getImageData(0,0,n,n).data,tiles=[],stride=Math.max(4,Math.round(size/14));for(let y=0;y<n;y+=stride)for(let x=0;x<n;x+=stride){let a=0;for(let yy=y;yy<Math.min(n,y+stride);yy++)for(let xx=x;xx<Math.min(n,x+stride);xx++)a=Math.max(a,data[(yy*n+xx)*4+3]);if(a>25){let r=Math.sin(x*127.1+y*311.7)*43758.5453;r-=Math.floor(r);tiles.push({x,y,r,angle:Math.sin(x*19+y*7)*Math.PI});}}return {b,n,tiles,stride};}let start=performance.now(),photo=null,loadId=0;$("photo").onchange=()=>{const f=$("photo").files[0];if(!f)return;const id=++loadId,url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(id===loadId){photo=im;reset()}};im.onerror=()=>{URL.revokeObjectURL(url);if(id===loadId)alert("画像を読み込めませんでした。JPEGまたはPNGをお試しください。")};im.src=url};$("clearPhoto").onclick=()=>{loadId++;photo=null;$("photo").value="";reset()};const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};function reset(){start=performance.now()}$('play').onclick=()=>{mode='single';audio.pause();reset()};$('ratio').onchange=()=>{let v=$('ratio').value==='9:16';c.width=v?1080:1920;c.height=v?1920:1080;reset()};$('word').oninput=reset;for(const const sg=snowSprite.getContext('2d'),grad=sg.createRadialGradient(24,24,0,24,24,24);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(.25,'rgba(255,255,255,.85)');grad.addColorStop(.65,'rgba(255,255,255,.25)');grad.addColorStop(1,'rgba(255,255,255,0)');sg.fillStyle=grad;sg.fillRect(0,0,48,48);

function openMemory(){return new Promise((resolve,reject)=>{const r=indexedDB.open('AISHURA-LYRIC-LAB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('single'))r.result.createObjectStore('single')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('保存領域が使用中です'))})}
async function memoryIO(write,value){const db=await openMemory();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('single',write?'readwrite':'readonly');const st=tx.objectStore('single');const r=write?st.put(value,'current'):st.get('current');tx.oncomplete=()=>resolve(r.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('保存処理が中断されました'))})}finally{db.close()}}
async function memoryAction(fn){if(recording)return;const a=$('storeOne'),b=$('restoreOne');a.disabled=b.disabled=true;audio.pause();try{await fn()}catch(e){$('memoryStatus').textContent='記憶エラー：'+(e.message||e)}finally{a.disabled=b.disabled=false}}
$('storeOne').onclick=()=>memoryAction(async()=>{if(!storedAudio)throw Error('音源を選択してください');if(await memoryIO(false)&&!confirm('保存済みの1曲を上書きしますか？'))return;const data={audio:storedAudio,photo:storedPhoto,cover:coverBlob,lines:[...lines],times:[...times],overrides:JSON.parse(JSON.stringify(overrides)),fields:Object.fromEntries(memoryFields.map(id=>[id,$(id).value])),savedAt:new Date().toISOString()};$('memoryStatus').textContent='保存中…';await memoryIO(true,data);const check=await memoryIO(false);if(!check||(check.cover?.size||0)!==(data.cover?.size||0)||check.audio.size!==data.audio.size||(check.photo?.size||0)!==(data.photo?.size||0)||JSON.stringify(check.times)!==JSON.stringify(data.times)||JSON.stringify(check.overrides)!==JSON.stringify(data.overrides)||JSON.stringify(check.lines)!==JSON.stringify(data.lines)||JSON.stringify(check.fields)!==JSON.stringify(data.fields))throw Error('保存後の照合に失敗');$('memoryStatus').textContent=`保存・照合成功：${((data.audio.size+(data.photo?.size||0))/1048576).toFixed(1)} MB / ${data.lines.length}行 / 同期 ${data.times.filter(t=>t!==null).length}行`});
$('restoreOne').onclick=()=>memoryAction(async()=>{const d=await memoryIO(false);if(!d)throw Error('保存データがありません');let im=null;if(d.photo){im=new Image();const u=URL.createObjectURL(d.photo);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('保存画像を読み込めません'));im.src=u})}finally{URL.revokeObjectURL(u)}}const restoredCover=d.cover?await loadCover(d.cover):null;coverLoad++;coverImage=restoredCover;coverBlob=d.cover||null;$('coverFile').value='';$('coverStatus').textContent=restoredCover?'雪背景を復元しました':'雪背景なし';$('coverOn').value='off';$('protectOn').value='off';$('resOn').value='off';mode='single';loadId++;storedAudio=d.audio;storedPhoto=d.photo||null;photo=im;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(d.audio);audio.src=audioURL;audio.load();$('audioFile').value='';$('photo').value='';for(const id of memoryFields){if(d.fields[id]!=null)$(id).value=d.fields[id]}$('ratio').onchange();for(const id of ['sz','dur'])$(id).dispatchEvent(new Event('input'));lines=[...d.lines];times=[...d.times];overrides=d.overrides||[];renderCues();reset();$('memoryStatus').textContent=`復元成功：${((d.audio.size+(d.photo?.size||0))/1048576).toFixed(1)} MB / ${lines.length}行 / 同期 ${times.filter(t=>t!==null).length}行（再生は開始しません）`});
memoryIO(false).then(d=>{$('memoryStatus').textContent=d?'保存済み素材あり — 素材を復元を押してください':'保存済み素材なし'}).catch(e=>{$('memoryStatus').textContent='保存領域確認エラー：'+e.message});
</script></html>
