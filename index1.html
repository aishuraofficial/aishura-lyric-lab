<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AISHURA LYRIC LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#111317;color:#e7e7e7;font:15px system-ui;padding:20px}main{max-width:900px;margin:auto}h1{font-size:19px;letter-spacing:.18em}small{color:#999}canvas{display:block;width:100%;max-height:65vh;object-fit:contain;background:#050609}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;color:inherit;background:#20242b;border:1px solid #444;border-radius:7px;padding:12px}input[type=text]{width:100%}input[type=range]{width:100%;padding:0}button{margin-top:16px;width:100%}</style><main><h1>AISHURA LYRIC LAB</h1><small>PROTOTYPE 05.1 / 水葬 × 雪解</small><canvas id="c" width="1920" height="1080"></canvas><label>背景画像（端末内のみ）</label><input id="photo" type="file" accept="image/*"><button id="clearPhoto">背景を解除</button><label>背景の明るさ</label><input id="bright" type="range" min="0.1" max="1" step="0.05" value="0.65"><label>背景の拡大率</label><input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"><label>文字色</label><input id="ink" type="color" value="#e4e4df"><label>文字の上下位置</label><input id="pos" type="range" min="20" max="85" value="56"><label>歌詞（端末内のみ）</label><input id="word" type="text" value="静かな夜に消えてゆく"><label>画面比率</label><select id="ratio"><option>16:9</option><option>9:16</option></select><label>文字サイズ</label><input id="sz" type="range" min="30" max="110" value="72"><label>演出時間（秒）</label><input id="dur" type="range" min="5" max="16" value="10"><label>波紋の大きさ</label><input id="rip" type="range" min="0.5" max="3" step="0.1" value="2"><label>雪解けの強さ</label><input id="melt" type="range" min="0.3" max="2" step="0.1" value="1.3"><button id="play">再生 / REPLAY</button><p><small>描画試作・動画出力未実装。入力内容は送信・保存しません。</small></p></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');const layers=Array.from({length:3},()=>document.createElement('canvas')), contexts=layers.map(l=>l.getContext('2d'));let glyphKey='',glyphs=[];function glyph(ch,size,color){const n=Math.ceil(size*1.7),b=document.createElement('canvas');b.width=b.height=n;const q=b.getContext('2d');q.font=`${size}px "Hiragino Mincho ProN", "Yu Mincho", serif`;q.textAlign='center';q.textBaseline='middle';q.fillStyle=color;q.fillText(ch,n/2,n/2);const data=q.getImageData(0,0,n,n).data,tiles=[],stride=Math.max(2,Math.round(size/24));for(let y=0;y<n;y+=stride)for(let x=0;x<n;x+=stride){let a=0;for(let yy=y;yy<Math.min(n,y+stride);yy++)for(let xx=x;xx<Math.min(n,x+stride);xx++)a=Math.max(a,data[(yy*n+xx)*4+3]);if(a>25){let r=Math.sin(x*127.1+y*311.7)*43758.5453;r-=Math.floor(r);tiles.push({x,y,r,angle:Math.sin(x*19+y*7)*Math.PI});}}return {b,n,tiles,stride};}let start=performance.now(),photo=null,loadId=0;$("photo").onchange=()=>{const f=$("photo").files[0];if(!f)return;const id=++loadId,url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(id===loadId){photo=im;reset()}};im.onerror=()=>{URL.revokeObjectURL(url);if(id===loadId)alert("画像を読み込めませんでした。JPEGまたはPNGをお試しください。")};im.src=url};$("clearPhoto").onclick=()=>{loadId++;photo=null;$("photo").value="";reset()};const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};function reset(){start=performance.now()}$('play').onclick=reset;$('ratio').onchange=()=>{let v=$('ratio').value==='9:16';c.width=v?1080:1920;c.height=v?1920:1080;reset()};$('word').oninput=reset;for(const id of ['bright','zoom','ink','pos','sz','dur','rip','melt'])$(id).addEventListener('change',reset);function frame(now){let W=c.width,H=c.height,t=Math.min(1.4,(now-start)/1000/Number($('dur').value)),base=H*Number($("pos").value)/100,chars=Array.from($('word').value).slice(0,40),s=Math.min(Number($('sz').value),W*.84/(Math.max(1,chars.length)*1.12)),step=s*1.12;for(let j=0;j<3;j++){let l=layers[j],q=contexts[j];if(l.width!==W||l.height!==H){l.width=W;l.height=H;}q.setTransform(1,0,0,1,0,0);q.globalAlpha=1;q.globalCompositeOperation='source-over';q.clearRect(0,0,W,H);}const [bgctx,rctx,txt]=contexts;const key=chars.join('')+'|'+s+'|'+$('ink').value;if(key!==glyphKey){glyphKey=key;glyphs=chars.map(ch=>glyph(ch,s,$('ink').value));}g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation="source-over";g.shadowBlur=0;g.shadowColor="transparent";g.clearRect(0,0,W,H);let bg=bgctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#040507');bg.addColorStop(.55,'#111820');bg.addColorStop(1,'#030507');bgctx.fillStyle=bg;bgctx.fillRect(0,0,W,H);let glow=bgctx.createRadialGradient(W/2,base,0,W/2,base,W*.55);glow.addColorStop(0,'rgba(105,130,150,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');bgctx.fillStyle=glow;bgctx.fillRect(0,0,W,H);if(photo){let z=Math.max(W/photo.naturalWidth,H/photo.naturalHeight)*Number($("zoom").value),w=photo.naturalWidth*z,h=photo.naturalHeight*z;bgctx.drawImage(photo,(W-w)/2,(H-h)/2,w,h);bgctx.fillStyle=`rgba(0,0,0,${1-Number($("bright").value)})`;bgctx.fillRect(0,0,W,H)}g.font=`${s}px "Hiragino Mincho ProN", "Yu Mincho", serif`;g.textAlign='center';g.textBaseline='middle';chars.forEach((ch,i)=>{let a=t-i*.009,p=smooth(a/.30),x=W/2+(i-(chars.length-1)/2)*step,y=base-s*.55-(1-p)*H*.28,fade=1-smooth((a-.62)/.25);if(a<0)return;let opacity=smooth(a/.12)*fade;const gl=glyphs[i],xx=x+Math.sin(i*2+a*9)*(1-p)*s*.25;let d=clamp((a-.55)/.40);if(a<.95){txt.save();txt.globalAlpha=smooth(a/.12);if(d===0){txt.drawImage(gl.b,xx-gl.n/2,y-gl.n/2);}else{for(const tile of gl.tiles){let release=.12+.65*tile.r+.12*(1-tile.y/gl.n),f=clamp((d-release)/.25),dx=tile.x-gl.n/2,dy=tile.y-gl.n/2;if(f===0){txt.drawImage(gl.b,tile.x,tile.y,gl.stride,gl.stride,xx+dx,y+dy,gl.stride,gl.stride);}else if(f<1){txt.globalAlpha=(1-f)*smooth(a/.12);let spread=Number($('melt').value);txt.drawImage(gl.b,tile.x,tile.y,gl.stride,gl.stride,xx+dx+Math.cos(tile.angle)*f*s*.65*spread,y+dy+f*f*s*1.4*spread,gl.stride*(1-f*.6),gl.stride*(1-f*.6));txt.globalAlpha=smooth(a/.12);}}}txt.restore();}let r=a-.30;if(r>0&&r<.85){for(let k=0;k<3;k++){let q=r-k*.045;if(q<=0)continue;let rad=q*W*.30*Number($('rip').value);rctx.beginPath();rctx.ellipse(x,base,rad,rad*.12,0,0,Math.PI*2);rctx.strokeStyle=`rgba(177,198,211,${.38*(1-clamp(q/.85))*Math.exp(-k*.5)})`;rctx.lineWidth=2.2;rctx.stroke();}} });for(const l of layers)g.drawImage(l,0,0);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
