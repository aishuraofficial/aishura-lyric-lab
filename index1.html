<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AISHURA LYRIC LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#111317;color:#e7e7e7;font:15px system-ui;padding:20px}main{max-width:900px;margin:auto}h1{font-size:19px;letter-spacing:.18em}small{color:#999}canvas{display:block;width:100%;max-height:65vh;object-fit:contain;background:#050609}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;color:inherit;background:#20242b;border:1px solid #444;border-radius:7px;padding:12px}input[type=text]{width:100%}input[type=range]{width:100%;padding:0}button{margin-top:16px;width:100%}</style><main><h1>AISHURA LYRIC LAB</h1><small>PROTOTYPE 02 / 水葬 × 雪解</small><canvas id="c" width="1920" height="1080"></canvas><label>歌詞（端末内のみ）</label><input id="word" type="text" value="静かな夜に消えてゆく"><label>画面比率</label><select id="ratio"><option>16:9</option><option>9:16</option></select><label>文字サイズ</label><input id="sz" type="range" min="30" max="110" value="72"><label>演出時間（秒）</label><input id="dur" type="range" min="5" max="16" value="10"><label>波紋の大きさ</label><input id="rip" type="range" min="0.5" max="3" step="0.1" value="2"><label>雪解けの強さ</label><input id="melt" type="range" min="0.3" max="2" step="0.1" value="1.3"><button id="play">再生 / REPLAY</button><p><small>描画試作・動画出力未実装。入力内容は送信・保存しません。</small></p></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let start=performance.now();const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};function reset(){start=performance.now()}$('play').onclick=reset;$('ratio').onchange=()=>{let v=$('ratio').value==='9:16';c.width=v?1080:1920;c.height=v?1920:1080;reset()};$('word').oninput=reset;function frame(now){let W=c.width,H=c.height,t=Math.min(1.4,(now-start)/1000/Number($('dur').value)),base=H*.56,chars=Array.from($('word').value).slice(0,40),s=Math.min(Number($('sz').value),W*.84/(Math.max(1,chars.length)*1.12)),step=s*1.12;let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#040507');bg.addColorStop(.55,'#111820');bg.addColorStop(1,'#030507');g.fillStyle=bg;g.fillRect(0,0,W,H);let glow=g.createRadialGradient(W/2,base,0,W/2,base,W*.55);glow.addColorStop(0,'rgba(105,130,150,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.fillRect(0,0,W,H);g.font=`${s}px "Hiragino Mincho ProN", "Yu Mincho", serif`;g.textAlign='center';g.textBaseline='middle';chars.forEach((ch,i)=>{let a=t-i*.009,p=smooth(a/.30),x=W/2+(i-(chars.length-1)/2)*step,y=base-s*.55-(1-p)*H*.28,fade=1-smooth((a-.62)/.25);if(a<0)return;let opacity=smooth(a/.12)*fade;g.save();g.globalAlpha=opacity;g.fillStyle='#e4e4df';g.fillText(ch,x+Math.sin(i*2+a*9)*(1-p)*s*.25,y);g.translate(x,base+s*.1);g.scale(1,-.48);g.globalAlpha=opacity*.16;g.fillText(ch,0,s*.7);g.restore();let r=a-.30;if(r>0&&r<.85){for(let k=0;k<3;k++){let q=r-k*.045;if(q<=0)continue;let rad=q*W*.30*Number($('rip').value);g.beginPath();g.ellipse(x,base,rad,rad*.12,0,0,Math.PI*2);g.strokeStyle=`rgba(177,198,211,${.38*(1-clamp(q/.85))*Math.exp(-k*.5)})`;g.lineWidth=2.2;g.stroke();}}if(a>.57&&a<.99){let d=(a-.57)/.42;for(let j=0;j<Math.round(45*Number($('melt').value));j++){let u=Math.sin(i*83+j*17),v=Math.cos(i*29+j*13);g.fillStyle=`rgba(222,232,238,${.65*Math.sin(Math.PI*d)})`;g.beginPath();g.arc(x+u*s*(.4+d),y+v*s*.5+d*d*s*2.4,0.8+(j%4)*.55,0,Math.PI*2);g.fill();}}});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
